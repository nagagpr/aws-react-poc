# Container deployment pipeline: GitHub -> Amazon ECR -> Amazon ECS Express Mode
#
#   pull_request -> main : build the image only (no AWS access, nothing pushed)
#   push         -> main : build, push to ECR (:<git-sha> and :latest), deploy to ECS Express Mode
#   workflow_dispatch    : same as push (manual run from the Actions tab)
#
# Authentication uses GitHub OIDC -> IAM role (no long-lived AWS keys stored anywhere).
# No account IDs are hardcoded: the ECR registry comes from the login step, role ARNs from secrets.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   AWS_DEPLOY_ROLE_ARN          arn:aws:iam::<AWS_ACCOUNT_ID>:role/github-actions-aws-react-poc
#   ECS_EXECUTION_ROLE_ARN       arn:aws:iam::<AWS_ACCOUNT_ID>:role/ecsTaskExecutionRole
#   ECS_INFRASTRUCTURE_ROLE_ARN  arn:aws:iam::<AWS_ACCOUNT_ID>:role/ecsInfrastructureRoleForExpressServices
# Optional repository variable (Variables tab), only if the account has no default VPC:
#   ECS_SUBNETS                  subnet-aaaa,subnet-bbbb   (public subnets in >= 2 AZs of one VPC)
#
# Setup guide: docs/GITHUB_ACTIONS_ECS_SETUP.md

name: Deploy to Amazon ECS (Express Mode)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # needed to request the OIDC token for AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aws-react-poc
  ECS_SERVICE: aws-react-poc
  ECS_CLUSTER: default

concurrency:
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check required repository secrets
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          EXEC_ROLE: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          INFRA_ROLE: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
        run: |
          missing=0
          [ -z "$DEPLOY_ROLE" ] && { echo "::error::Repository secret AWS_DEPLOY_ROLE_ARN is not set"; missing=1; }
          [ -z "$EXEC_ROLE" ]   && { echo "::error::Repository secret ECS_EXECUTION_ROLE_ARN is not set"; missing=1; }
          [ -z "$INFRA_ROLE" ]  && { echo "::error::Repository secret ECS_INFRASTRUCTURE_ROLE_ARN is not set"; missing=1; }
          if [ "$missing" = 1 ]; then
            echo "::error::Follow docs/GITHUB_ACTIONS_ECS_SETUP.md, then re-run this workflow."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-aws-react-poc
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=local/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false # plain image manifest; avoids untagged attestation artifacts in ECR

      - name: Deploy to Amazon ECS Express Mode
        id: deploy
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service-name: ${{ env.ECS_SERVICE }}
          image: ${{ steps.image.outputs.name }}:${{ github.sha }}
          execution-role-arn: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 80
          health-check-path: / # Nginx serves index.html at "/" (action default is /ping)
          # Optional: comma-separated PUBLIC subnet IDs (>= 2 AZs, same VPC). Set as a repository
          # *variable* ECS_SUBNETS when the account has no default VPC; leave unset to use the default VPC.
          subnets: ${{ vars.ECS_SUBNETS }}
          cpu: 256 # 0.25 vCPU - plenty for Nginx serving static files
          memory: 512 # 0.5 GB
          min-task-count: 1
          max-task-count: 2

      - name: Deployment summary
        if: github.event_name != 'pull_request'
        run: |
          EP="${{ steps.deploy.outputs.endpoint }}"; EP="${EP#https://}"; EP="${EP#http://}"
          echo "### Deployed to Amazon ECS Express Mode :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Service ARN:** ${{ steps.deploy.outputs.service-arn }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** https://$EP" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image tag:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
